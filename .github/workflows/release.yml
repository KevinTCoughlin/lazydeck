name: Release

on:
  push:
    tags:
      - "v*"

# Default to read-only; the release job opts into exactly what it needs.
permissions:
  contents: read

jobs:
  test-gate:
    name: Test gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.5"
      - name: Python tests (frozen)
        working-directory: python
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen python -m unittest discover -s . -p 'test_*.py'

  goreleaser:
    name: GoReleaser
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      id-token: write # mint the OIDC token used to sign the provenance
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history + tags so GoReleaser can compute the changelog and
          # build the exact tagged commit.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
      - name: Install uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.5"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          syft-version: "v1.51.0"
      - name: Verify Python lockfile is current
        working-directory: python
        run: uv lock --check
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sbom.json
            dist/checksums.txt
