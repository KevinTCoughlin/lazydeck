name: Release

# One pipeline, two ways in:
#
#   * Every push to main runs release-please, which keeps a "chore(main): release X"
#     PR up to date with the next version and CHANGELOG.md entry computed from
#     Conventional Commit PR titles. Merging that PR creates the tag and
#     GitHub release, and the jobs below then build and publish into it.
#   * workflow_dispatch with an explicit tag (e.g. v0.3.0-rc.1 for a release
#     candidate) tags the dispatched main commit and runs the same jobs.
#
# Tags are always created by this workflow, never pushed by hand: a tag
# created with GITHUB_TOKEN doesn't trigger other workflows, so there is
# exactly one path from tag to published artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release from the dispatched main commit, e.g. v0.3.0-rc.1 (any semver prerelease publishes as a GitHub prerelease)"
        required: true
        type: string

# Default to read-only; each job opts into exactly what it needs.
permissions:
  contents: read

# Never cancel a release mid-flight. Push runs queue behind each other (a
# superseded pending run is harmless: release-please picks up any merged
# release PR on its next run); dispatches queue separately so a push can't
# displace one.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag and GitHub release
      pull-requests: write # open/update the release PR
      issues: write # label the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Optional GitHub App/PAT token so the release PR triggers CI (PRs
          # opened with GITHUB_TOKEN don't). Falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    name: Plan release
    needs: release-please
    # Run after release-please on push, or on its own for workflow_dispatch.
    if: ${{ !cancelled() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag on the workflow_dispatch path
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [ "${EVENT}" = "push" ]; then
            if [ "${RELEASE_CREATED}" = "true" ]; then
              tag="${RELEASE_PLEASE_TAG}"
            fi
          else
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Releases are cut from main only (dispatched from ${GITHUB_REF})."
              exit 1
            fi
            tag="${DISPATCH_TAG}"
            if ! printf '%s' "${tag}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::'${tag}' is not a vMAJOR.MINOR.PATCH[-PRERELEASE] tag."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              if [ "$(git rev-list -n 1 "${tag}")" != "${GITHUB_SHA}" ]; then
                echo "::error::Tag ${tag} already exists on a different commit."
                exit 1
              fi
            else
              git tag "${tag}" "${GITHUB_SHA}"
              git push origin "refs/tags/${tag}"
            fi
          fi
          version="${tag#v}"
          prerelease=false
          case "${version}" in *-*) prerelease=true ;; esac
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"
          if [ -n "${tag}" ]; then
            echo "Releasing ${tag} (prerelease: ${prerelease})" >> "${GITHUB_STEP_SUMMARY}"
          fi

  test-gate:
    name: Test gate (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.tag != '' }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Python tests (frozen)
        working-directory: python
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen python -m unittest discover -s . -p 'test_*.py'

  goreleaser:
    name: GoReleaser
    needs: [plan, test-gate]
    if: ${{ !cancelled() && needs.plan.outputs.tag != '' && needs.test-gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      id-token: write # keyless cosign signing + provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          # Full history + tags so GoReleaser can compute the changelog and
          # build the exact tagged commit.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: "v1.51.0"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify Python lockfile is current
        working-directory: python
        run: uv lock --check
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Used only when GoReleaser creates the release (workflow_dispatch);
          # release-please's own release already carries these notes.
          scripts/release-notes.sh "${TAG}" > "${RUNNER_TEMP}/release-notes.md"
          if [ -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "RELEASE_NOTES_ARGS=--release-notes=${RUNNER_TEMP}/release-notes.md" >> "${GITHUB_ENV}"
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: release --clean ${{ env.RELEASE_NOTES_ARGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.plan.outputs.tag }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sbom.json
            dist/checksums.txt

  container:
    name: Container image
    needs: [plan, goreleaser]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # attest the image
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Fetch release Debian packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/image"
          cp packaging/container/Dockerfile "${RUNNER_TEMP}/image/"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*_linux_amd64.deb' --pattern '*_linux_arm64.deb' \
            --pattern checksums.txt --dir "${RUNNER_TEMP}/image"
          cd "${RUNNER_TEMP}/image"
          sha256sum --ignore-missing -c checksums.txt
          rm checksums.txt
      - name: Image name and tags
        id: meta
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${VERSION}"
          if [ "${PRERELEASE}" != "true" ]; then
            tags="${tags},${image}:${VERSION%.*},${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: ${{ runner.temp }}/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  homebrew:
    name: Homebrew tap
    needs: [plan, goreleaser]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' && needs.plan.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    env:
      # Fine-grained token (or GitHub App token) with contents: write on
      # KevinTCoughlin/homebrew-lazydeck. Without it this job only logs a
      # notice, so releases never block on the tap.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for tap token
        id: token
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "present=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ needs.plan.outputs.tag }}
          path: lazydeck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: KevinTCoughlin/homebrew-lazydeck
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update and push formula
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --dir "${RUNNER_TEMP}"
          lazydeck/scripts/bump-homebrew-formula.sh tap/lazydeck.rb "${VERSION}" "${RUNNER_TEMP}/checksums.txt"
          cd tap
          if git diff --quiet; then
            echo "Formula already points at ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: update lazydeck to ${VERSION}"
          git push

  verify:
    name: Verify published release (${{ matrix.os }})
    needs: [plan, goreleaser]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Exercise what users actually download -- the published assets via
      # install.sh -- rather than the workspace's dist/.
      - name: Install with install.sh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          PREFIX="${RUNNER_TEMP}/lazydeck" ./install.sh
          "${RUNNER_TEMP}/lazydeck/bin/lazydeck" version | tee "${RUNNER_TEMP}/version.txt"
          grep -F "lazydeck ${VERSION} " "${RUNNER_TEMP}/version.txt"
      - name: Verify checksum signature and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd "${RUNNER_TEMP}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json --pattern '*_linux_amd64.tar.gz'
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify ./*_linux_amd64.tar.gz --repo "${GITHUB_REPOSITORY}"
