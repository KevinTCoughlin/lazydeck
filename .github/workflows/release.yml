name: Release

on:
  push:
    tags:
      - "v*"

# Default to read-only; the release job opts into exactly what it needs.
permissions:
  contents: read

jobs:
  test-gate:
    name: Test gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Python tests (frozen)
        working-directory: python
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen python -m unittest discover -s . -p 'test_*.py'

  goreleaser:
    name: GoReleaser
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      id-token: write # mint the OIDC token used to sign the provenance
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so GoReleaser can compute the changelog and
          # build the exact tagged commit.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: "v1.51.0"
      - name: Verify Python lockfile is current
        working-directory: python
        run: uv lock --check
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sbom.json
            dist/checksums.txt
