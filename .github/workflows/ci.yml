name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo. No job may write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      # go test ./... exercises internal/tui, whose client.New shells out
      # to uv to run the bundled Python bridge -- uv must be on PATH even
      # though this job has no `run: uv ...` step of its own.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        run: go test -race ./...

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
      - name: Install from lockfile (frozen)
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s . -p 'test_*.py' -v

  goreleaser-check:
    name: GoReleaser config + snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: "v1.51.0"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: check
      - name: Snapshot build (no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: release --snapshot --clean
      - name: Install and smoke-test Debian package
        run: |
          package="$(find dist -maxdepth 1 -name '*_linux_amd64.deb' -print -quit)"
          test -n "${package}"
          package="$(realpath "${package}")"
          dpkg-deb --contents "${package}" | grep -F './usr/share/man/man1/lazydeck.1' >/dev/null
          dpkg-deb --contents "${package}" | grep -F './usr/share/bash-completion/completions/lazydeck' >/dev/null
          dpkg-deb --contents "${package}" | grep -F './usr/share/zsh/vendor-completions/_lazydeck' >/dev/null
          dpkg-deb --contents "${package}" | grep -F './usr/share/fish/vendor_completions.d/lazydeck.fish' >/dev/null
          sudo apt-get update
          sudo apt-get install --yes "${package}"
          lazydeck version
          test -f /usr/share/lazydeck/python/cli.py
          test -x /usr/libexec/lazydeck/uv
          test -f /usr/lib/systemd/user/lazydeck-serve.service

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh packaging/deb/postinstall.sh scripts/*.sh

  container:
    name: Container parity (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ci, godot-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      # GHA-backed layer cache, scoped per matrix target: without it every
      # push/PR re-downloads and re-verifies the full Godot editor +
      # export templates (scripts/fetch-godot.sh, ~500MB) from scratch in
      # the godot-integration leg, since a plain `docker build` on a
      # GitHub-hosted runner starts with an empty local layer cache every
      # run. Layers before an unchanged step (go.mod/go.sum, apt
      # packages, the Godot download) are reused whenever those inputs
      # haven't changed, so only the `COPY . .` layer onward is rebuilt on
      # a typical code-only change.
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          tags: lazydeck-${{ matrix.target }}:test
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - run: docker run --rm lazydeck-${{ matrix.target }}:test
