[project]
name = "lazydeck-cli"
version = "0.2.0"
description = "Headless CLI wrapper around Valve's steamos-devkit client library, driven by lazydeck."
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
    "appdirs>=1.4",
    "signalslot>=0.2",
    "ifaddr>=0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.16.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# vendor/ is Valve/Collabora's third-party devkit_client, kept as-is
# rather than reformatted to our style.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# cli.py inserts vendor/ onto sys.path before importing from it, so those
# imports can't be at the top of the file (E402) — that's intentional, not
# a mistake to fix.
per-file-ignores = { "cli.py" = ["E402"] }
