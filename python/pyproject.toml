[project]
name = "devkit-cli"
version = "0.1.0"
description = "Headless CLI wrapper around Valve's steamos-devkit client library, driven by devkit-tui."
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
    "appdirs>=1.4",
    "signalslot>=0.2",
    "ifaddr>=0.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# cli.py inserts vendor/ onto sys.path before importing from it, so those
# imports can't be at the top of the file (E402) — that's intentional, not
# a mistake to fix.
per-file-ignores = { "cli.py" = ["E402"] }
